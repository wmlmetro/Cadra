# Cadra modern frontend — static SPA served by nginx, deployed alongside the
# Odoo backend and routed at /app/* by the shared ingress (see 60-ingress.yaml).
#
# Stateless and tiny: no PVC, no envFrom secrets, no DB dependency.
# RollingUpdate is fine — the bundle is immutable per-image, and the Ingress
# can fan out across both pods during a roll-out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gtb-dev
  labels:
    app: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # ─── REPLACE before applying ─────────────────────────────────
          image: REPLACE_ME/cadra-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            # UID 101 = nginx user baked into nginx:1.27-alpine. Naming it
            # explicitly here means the kubelet can verify it's non-zero
            # without relying on the image USER directive.
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
