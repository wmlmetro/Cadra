# nginx Ingress with cert-manager TLS. Path routing:
#   /app/*        → frontend Service (modern React SPA, 43/44-frontend-*.yaml)
#   /longpolling  → odoo:8072
#   /websocket    → odoo:8072
#   /  (catch)    → odoo:8069 (HTTP workers, including /api/v1/* and /web/*)
#
# Pre-reqs in the cluster:
#   - ingress-nginx controller installed
#   - cert-manager installed
#   - DNS A/CNAME for the host below pointing at the ingress controller's
#     external IP / LB hostname (cert-manager's HTTP-01 challenge needs it)
#   - the ClusterIssuer in 61-cluster-issuer.yaml applied
#
# Edit `host:` to your real domain before applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cadra
  namespace: cadra-dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "720"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "720"
spec:
  ingressClassName: nginx
  # One SAN cert (HTTP-01) covering every tenant host. Add new clients to BOTH
  # this list and the rules below. (A wildcard *.cadra.ng would remove the
  # per-client edit, but needs a DNS-01 issuer — deferred until onboarding
  # cadence justifies it.)
  tls:
    - hosts:
        - staging.app.cadra.ng
        - gtb.cadra.ng
        - jaizbankplc.cadra.ng
        - lasg.cadra.ng
      secretName: cadra-tls
  rules:
    # Each tenant host reuses the same path routing (anchored below). The
    # tenant database is selected by Odoo's dbfilter from the host's first
    # label, so <client>.cadra.ng -> DB "<client>" (see 10-configmap-odoo.yaml).
    #
    # To onboard a client: (1) add its host here with `http: *odoo-paths`,
    # (2) add the host to the tls list above, (3) create + bootstrap the DB
    # named after the subdomain label, (4) point DNS at the ingress LB.
    # Last tenant still on Odoo 15 (lasg) — flip it the same way when ready.
    - host: lasg.cadra.ng          # -> DB "lasg" (Lagos State Ministry of Health, still on 15)
      http:
        paths:
          # Modern React SPA — served by the `frontend` Service. Must precede
          # the `/` catch-all so /app/* doesn't fall through to Odoo.
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /longpolling
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  number: 8072
          - path: /websocket
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  number: 8072
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  number: 8069
    # CUTOVER: gtb is flipped to the Odoo 19 stack. Its backend points at the
    # odoo-19 Service (the DB "gtb" was renamed from the seeded "gtb19"; the old
    # 15 DB is preserved as "gtb_15bak"). /app still uses the shared frontend.
    # Rollback: switch these backends back to `odoo` and rename the DBs back.
    - host: gtb.cadra.ng           # -> DB "gtb" on odoo-19 (Guaranty Trust Bank)
      http: &odoo19-paths
        paths:
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /longpolling
            pathType: Prefix
            backend:
              service:
                name: odoo-19
                port:
                  number: 8072
          - path: /websocket
            pathType: Prefix
            backend:
              service:
                name: odoo-19
                port:
                  number: 8072
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odoo-19
                port:
                  number: 8069
    # CUTOVER: NRS/staging flipped to the Odoo 19 stack (odoo-19 Service). The DB
    # "staging" was renamed to "staging_15bak" (preserved for rollback) and the
    # fully-provisioned "staging19" -> "staging". Rollback = swap names back +
    # point this host back at *odoo-paths.
    # (lasg is still on 15 above — flip it the same way when ready.)
    - host: staging.app.cadra.ng   # -> DB "staging" on odoo-19 (Nigeria Revenue Service)
      http: *odoo19-paths
    # CUTOVER: jaiz flipped to Odoo 19 (jaizbankplc -> jaizbankplc_15bak, seeded
    # jaizbankplc19 -> jaizbankplc). Rollback = swap names + point back at odoo.
    - host: jaizbankplc.cadra.ng   # -> DB "jaizbankplc" on odoo-19 (Jaiz Bank Plc)
      http: *odoo19-paths
