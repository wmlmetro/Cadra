apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config-19
  namespace: cadra-dev
data:
  odoo.conf: |
    [options]
    ; ─── Odoo 19 configuration for Kubernetes (the rebuild stack) ────────
    ; 19 counterpart of odoo-config. db_user / db_password are appended at
    ; container start from the cadra-db Secret (the pods override the image
    ; entrypoint, so its HOST/USER/PASSWORD injection does not run).
    ; db_name is intentionally NOT set — the DB is chosen per-request by
    ; dbfilter. The bootstrap/upgrade Jobs pin db_name to one tenant.
    db_host = db
    db_port = 5432

    ; HTTP. Odoo 16+ renamed longpolling_port -> gevent_port (websocket).
    http_port = 8069
    gevent_port = 8072
    http_interface = 0.0.0.0
    proxy_mode = True

    ; ─── Multi-tenant routing ───────────────────────────────────────────
    ; DB = the first host label. The 19 stack serves 19 tenant DBs on
    ; <tenant>19 hostnames (e.g. staging19.app.cadra.ng -> DB "staging19"),
    ; alongside the live 15 stack, until the DNS flip.
    dbfilter = ^%d$

    without_demo = True
    list_db = False
    log_level = info

    ; ─── Telemetry: off ─────────────────────────────────────────────────
    ; Odoo's "Publisher: Update Notification" cron (mail.ir_cron_module_
    ; update_notification) POSTs weekly, per database, to
    ; http://services.odoo.com/publisher-warranty/. The payload is assembled
    ; at mail/models/update.py::_get_message and carries the database name and
    ; uuid, web.base.url, the installed application list, user counts — and the
    ; company's name, email and phone. On this cluster that is the Nigeria
    ; Revenue Service, Guaranty Trust Bank, Jaiz Bank Plc and the Lagos State
    ; Ministry of Health. Client identity is not ours to disclose to a third
    ; party as a side effect of a default nobody chose.
    ;
    ; Pointing the URL at a closed local port is the durable half: it covers
    ; every database including tenants not yet created, and it holds whatever
    ; an ir_cron row in any one of them says. The cron row is deactivated per
    ; tenant as well (myservice_nrs_base, _cadra_disable_third_party_crons),
    ; because the server action calls update_notification(None) — cron_mode
    ; falsy — so it RAISES on a refused connection rather than returning False,
    ; which would otherwise mean a weekly ERROR and a climbing failure_count on
    ; every tenant.
    ;
    ; NOTE: this ConfigMap is mounted with subPath (41-odoo-19-deployment.yaml),
    ; and subPath mounts are excluded from Kubernetes' ConfigMap update
    ; propagation — the file in a running pod never changes. Merging this does
    ; not apply it. It takes a deliberate roll of the odoo-19 deployment.
    publisher_warranty_url = http://localhost:1/publisher-warranty/

    ; Addons: Odoo 19 core + repo root + CRND 19 foundation + OCA 19 bundle.
    ; (No legacy dist/ tree — the rebuild installs a trimmed, ported set.)
    addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/crnd-19,/mnt/extra-addons/oca-19

    ; Resource limits — kept BELOW the pod's K8s memory limit so Odoo
    ; recycles workers before the kubelet OOMKills the pod.
    limit_memory_soft = 1342177280
    limit_memory_hard = 1610612736
    limit_request = 8192
    limit_time_cpu = 600
    limit_time_real = 1200

    ; admin_passwd is injected at runtime by the container command
    ; using ODOO_MASTER_PASSWORD from the cadra-odoo Secret.
