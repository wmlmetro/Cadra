# One-off NRS master-data import Job. Runs the locally-built cadra-nrs-import
# image (Dockerfile.nrs-import — bakes the gitignored NRS_asset_seed pack) to
# reproduce NRS employees + assets on a fresh 19 DB (staging19), pulling the
# location tree from the live `staging` (15) DB. Talks to the odoo-19 Service
# over XML-RPC and the shared `db` Postgres directly. Idempotent.
#
# Prereq: staging19 already bootstrapped (deploy-19 run_bootstrap=true,
# bootstrap_db=staging19, extra=cadra_brand_nrs) — that installs modules + grants
# admin the Asset Manager group (required, or asset creates are denied).
#
# The image ref is sed-substituted by nrs-import.yml (REPLACE_ME_IMAGE).
#
# ODOO_ADMIN_PW is the Odoo *admin user* password used for XML-RPC (not the
# master password, which is ODOO_MASTER_PASSWORD). It used to be baked into
# the image as `admin` and this comment documented the fallback rather than
# setting the variable — so the Job authenticated as the tenant's admin on a
# password committed to this repository, shipped inside a pulled image layer.
# It now comes from the cadra-odoo Secret and the entrypoint refuses without
# it. Add the key before running the Job:
#
#   kubectl -n cadra-dev patch secret cadra-odoo --type merge \
#     -p '{"stringData":{"ODOO_ADMIN_PASSWORD":"<password>"}}'
#
# Without it the pod stays in CreateContainerConfigError, which is the
# refusal: a missing credential must stop the run, not pick one.
#
# Re-run: kubectl -n cadra-dev delete job cadra-nrs-import && kubectl apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: cadra-nrs-import
  namespace: cadra-dev
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      # NOT app: odoo-19 — that is the odoo-19 Service selector, so labelling the
      # Job pod with it makes it a bogus Service endpoint and XML-RPC calls to
      # odoo-19:8069 round-robin onto this pod (no listener) → Connection refused.
      labels:
        app: nrs-import
        job: nrs-import
    spec:
      restartPolicy: Never
      containers:
        - name: nrs-import
          image: REPLACE_ME_IMAGE
          imagePullPolicy: IfNotPresent
          env:
            - name: ODOO_URL
              value: "http://odoo-19:8069"
            - name: SOURCE_DB
              value: "staging"       # live 15 DB to export locations from
            - name: TARGET_DB
              value: "staging19"     # fresh 19 DB to load into
            - name: DB_HOST
              value: db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cadra-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cadra-db
                  key: POSTGRES_PASSWORD
            - name: ODOO_ADMIN_PW
              valueFrom:
                secretKeyRef:
                  name: cadra-odoo
                  key: ODOO_ADMIN_PASSWORD
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
