# One-shot Job that runs scripts/backfill_depreciation.py against a tenant DB
# via `odoo shell`. The script ships in the image (Dockerfile.odoo.19.k8s copies
# scripts/ to /opt/cadra/scripts/), so nothing is mounted in.
#
# Run via .github/workflows/depreciation-backfill.yml (workflow_dispatch).
#
# Unlike 51-upgrade-19-job.yaml this needs NO scale-down: it writes data only —
# no schema change, no manifest re-read — so odoo-19 keeps serving every tenant
# throughout. The emptyDir filestore avoids RWO PVC contention with odoo-19, and
# the pod label is deliberately NOT app: odoo-19 (that would register the Job as
# a Service endpoint and break serving).
#
# The script defaults to a DRY RUN. BACKFILL_APPLY=1 is what commits.
apiVersion: batch/v1
kind: Job
metadata:
  name: cadra-depreciation-backfill
  namespace: cadra-dev
spec:
  backoffLimit: 0          # A partial re-run is confusing; fix and re-dispatch.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: cadra-depreciation-backfill
        job: depreciation-backfill
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 101
      initContainers:
        - name: wait-for-db
          image: postgres:13
          command:
            - sh
            - -c
            - |
              echo "waiting for postgres at db:5432..."
              for i in $(seq 1 120); do
                if pg_isready -h db -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
                  echo "postgres ready after ${i}s"; exit 0
                fi
                sleep 1
              done
              echo "FATAL: postgres did not become ready in 120s" >&2; exit 1
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cadra-db
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cadra-db
                  key: POSTGRES_USER
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }

      containers:
        - name: backfill
          # ─── REPLACE before applying ─────────────────────────────────
          image: REPLACE_ME_IMAGE
          imagePullPolicy: Always
          command:
            - bash
            - -c
            - |
              set -e
              cp /etc/odoo/odoo.conf.template /tmp/odoo.conf
              {
                printf '\nadmin_passwd = %s\n' "$ODOO_MASTER_PASSWORD"
                printf 'db_user = %s\n' "$USER"
                printf 'db_password = %s\n' "$PASSWORD"
              } >> /tmp/odoo.conf

              DB="${TARGET_DB:-$DB}"
              SCRIPT=/opt/cadra/scripts/backfill_depreciation.py
              if [ ! -f "$SCRIPT" ]; then
                echo "FATAL: $SCRIPT not in image — is scripts/ copied in Dockerfile.odoo.19.k8s?" >&2
                exit 1
              fi
              echo "running backfill against '$DB' (APPLY=${BACKFILL_APPLY:-0} ERP_MANAGED=${BACKFILL_ERP_MANAGED:-0} NO_NAME_MATCH=${BACKFILL_NO_NAME_MATCH:-0})"
              # --http-port avoids colliding with odoo-19 on 8069 even though
              # the shell does not serve; Odoo still binds without it.
              exec odoo shell -c /tmp/odoo.conf -d "$DB" --no-http --http-port=8099 \
                   --log-level=error --shell-interface=python < "$SCRIPT"
          env:
            - name: HOST
              value: db
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: cadra-db
                  key: POSTGRES_USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cadra-db
                  key: POSTGRES_PASSWORD
            - name: DB
              valueFrom:
                secretKeyRef:
                  name: cadra-db
                  key: POSTGRES_DB
            - name: TARGET_DB
              value: "REPLACE_ME_TARGET_DB"
            - name: BACKFILL_APPLY
              value: "REPLACE_ME_APPLY"
            - name: BACKFILL_ERP_MANAGED
              value: "REPLACE_ME_ERP_MANAGED"
            - name: BACKFILL_NO_NAME_MATCH
              value: "REPLACE_ME_NO_NAME_MATCH"
            - name: ODOO_MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cadra-odoo
                  key: ODOO_MASTER_PASSWORD
          volumeMounts:
            - name: odoo-config
              mountPath: /etc/odoo/odoo.conf.template
              subPath: odoo.conf
              readOnly: true
            - name: odoo-filestore
              mountPath: /var/lib/odoo
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { cpu: 1500m, memory: 4Gi }
      volumes:
        - name: odoo-config
          configMap:
            name: odoo-config-19
        - name: odoo-filestore
          emptyDir: {}
