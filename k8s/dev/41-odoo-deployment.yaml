apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: cadra-dev
  labels:
    app: odoo
spec:
  replicas: 1
  strategy:
    # Odoo can't run two writers against the same DB row state — Recreate
    # avoids the brief overlap window that RollingUpdate would create.
    type: Recreate
  selector:
    matchLabels:
      app: odoo
  template:
    metadata:
      labels:
        app: odoo
    spec:
      securityContext:
        # odoo:15.0 image runs as uid/gid 101 (odoo:odoo). fsGroup ensures
        # the mounted PVC is group-writable by that user.
        fsGroup: 101
      containers:
        - name: odoo
          # ─── REPLACE before applying ─────────────────────────────────
          image: REPLACE_ME/cadra-odoo:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8069
            - name: longpoll
              containerPort: 8072
          env:
            # Odoo image entrypoint expects HOST/USER/PASSWORD env names.
            - name: HOST
              value: db
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: cadra-db
                  key: POSTGRES_USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cadra-db
                  key: POSTGRES_PASSWORD
            - name: ODOO_MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cadra-odoo
                  key: ODOO_MASTER_PASSWORD
          envFrom:
            - configMapRef:
                name: odoo-bootstrap
          # Same trick as docker-compose.prod.yml: copy the read-only conf
          # template to a writable path and append admin_passwd at start.
          command:
            - bash
            - -c
            - |
              set -e
              cp /etc/odoo/odoo.conf.template /tmp/odoo.conf
              printf '\nadmin_passwd = %s\n' "$ODOO_MASTER_PASSWORD" >> /tmp/odoo.conf
              exec odoo -c /tmp/odoo.conf \
                --workers="${ODOO_WORKERS:-1}" \
                --max-cron-threads="${ODOO_MAX_CRON_THREADS:-1}"
          volumeMounts:
            - name: odoo-config
              mountPath: /etc/odoo/odoo.conf.template
              subPath: odoo.conf
              readOnly: true
            - name: odoo-filestore
              mountPath: /var/lib/odoo
          readinessProbe:
            httpGet:
              path: /web/login
              port: 8069
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /web/login
              port: 8069
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
      volumes:
        - name: odoo-config
          configMap:
            name: odoo-config
        - name: odoo-filestore
          persistentVolumeClaim:
            claimName: odoo-filestore
