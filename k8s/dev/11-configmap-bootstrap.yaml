apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-bootstrap
  namespace: cadra-dev
data:
  # Comma-separated module list consumed by `odoo -i` during the bootstrap Job.
  # Mirrors CADRA_BOOTSTRAP_MODULES in .env.example.
  CADRA_BOOTSTRAP_MODULES: "myservice_api,myservice_asset_register,myservice_barcode_station,myservice_dashboard,myservice_email_relay,myservice_fleet_maintenance,myservice_fm_dashboard,myservice_identity,myservice_nrs_base,myservice_request_fields,myservice_security,myservice_staff_bus,myservice_theme_v5,myservice_website_theme,myservice_workflow,web_responsive"

  # Seed profiles (defined in scripts/bootstrap.py):
  #   core            = ITSM + Nigeria locations + 415 FIRS offices (v1 loader)
  #   fleet           = core + 1,617-vehicle master seed (slow)
  #   full            = ITSM + locations + 415 offices (v3 loader) + master
  #                     seed + NRS HQ asset register (1,272 assets) + HQ
  #                     location metadata + fleet taxonomy + fleet→location
  #                     matcher. Validated 2026-06-01 on a fresh dev DB.
  #                     Runtime ~12-15 min, within the 20 min Job cap.
  #   full-no-master  = full minus master_seed. Use when master has already
  #                     run and you only need the 4 follow-on seeds — saves
  #                     ~7 min of idempotent rework.
  #   full+geo        = full + OpenStreetMap geocoding (adds ~30 min;
  #                     deploy-dev.yml bootstrap-wait raised to 60m).
  #   full-no-master+geo = full-no-master + geocoding. Adds ~30 min.
  #                     Required for the dashboard map markers to use real
  #                     coords. Active profile.
  #   ""              = no seeds.
  CADRA_SEED_PROFILE: "full-no-master+geo"

  # Single worker keeps the memory floor low. Override per-environment by
  # editing this ConfigMap and rolling the Odoo Deployment.
  ODOO_WORKERS: "1"
  ODOO_MAX_CRON_THREADS: "1"

  # Smoke-test API client identifier. Secret comes from cadra-odoo Secret.
  CADRA_TEST_CLIENT_ID: "test_client"
