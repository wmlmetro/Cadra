apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo-19
  namespace: cadra-dev
  labels:
    app: odoo-19
spec:
  replicas: 1
  strategy:
    # Odoo can't run two writers against the same DB row state — Recreate
    # avoids the brief overlap window that RollingUpdate would create.
    type: Recreate
  selector:
    matchLabels:
      app: odoo-19
  template:
    metadata:
      labels:
        app: odoo-19
    spec:
      securityContext:
        # odoo:19.0 image runs as uid/gid 101 (odoo:odoo), same as 15.0.
        fsGroup: 101
      containers:
        - name: odoo
          # ─── REPLACE before applying (deploy-dev.yml sed-substitutes it) ──
          image: REPLACE_ME/cadra-odoo-19:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8069
            - name: gevent
              containerPort: 8072
          env:
            - name: HOST
              value: db
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: cadra-db
                  key: POSTGRES_USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cadra-db
                  key: POSTGRES_PASSWORD
            - name: ODOO_MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cadra-odoo
                  key: ODOO_MASTER_PASSWORD
            # Handoff 65. Optional: the owner's provider key for Identify
            # from photo, read by the SERVER from its environment on every
            # call and kept in no database (it was a bootstrap-mirrored
            # parameter in 64). Absent: no tenant can identify, and each
            # says so. Set it as the GitHub secret `CADRA_AI_API_KEY`:
            # deploy-dev syncs it into cadra-odoo on every push (a key
            # patched in by hand is wiped by the next push). A change takes
            # effect on the next ROLLOUT of odoo-19, which a push does not
            # do. Placing it switches nothing on (`cadra.ai.identify`).
            - name: CADRA_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cadra-odoo
                  key: CADRA_AI_API_KEY
                  optional: true
            # Handoff 68. Optional, the same way: OpenAI's key, the second
            # provider, its own variable so both can be held at once. The
            # GitHub secret `CADRA_OPENAI_API_KEY`, synced by deploy-dev.
            - name: CADRA_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cadra-odoo
                  key: CADRA_OPENAI_API_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: odoo-bootstrap-19
          command:
            - bash
            - -c
            - |
              set -e
              cp /etc/odoo/odoo.conf.template /tmp/odoo.conf
              {
                printf '\nadmin_passwd = %s\n' "$ODOO_MASTER_PASSWORD"
                printf 'db_user = %s\n' "$USER"
                printf 'db_password = %s\n' "$PASSWORD"
              } >> /tmp/odoo.conf
              exec odoo -c /tmp/odoo.conf \
                --workers="${ODOO_WORKERS:-1}" \
                --max-cron-threads="${ODOO_MAX_CRON_THREADS:-1}"
          volumeMounts:
            # subPath mounts are EXCLUDED from Kubernetes' ConfigMap update
            # propagation: this file never changes inside a running pod, and the
            # command above copies it to /tmp/odoo.conf at startup anyway. So
            # `kubectl apply` on odoo-config-19 changes the cluster and changes
            # nothing that is running — only a roll of this Deployment does.
            # deploy-dev.yml and deploy-19.yml both end by comparing the running
            # pod against the ConfigMap and failing the job when they differ, so
            # an applied-but-inert config change is loud instead of silent.
            - name: odoo-config
              mountPath: /etc/odoo/odoo.conf.template
              subPath: odoo.conf
              readOnly: true
            - name: odoo-filestore
              mountPath: /var/lib/odoo
          # Probe with a Host header for a real 19 tenant so dbfilter resolves
          # to an existing DB and /web/login returns 200. Keep in sync with the
          # primary 19 tenant DB name (staging19).
          readinessProbe:
            httpGet:
              path: /web/login
              port: 8069
              httpHeaders:
                - name: Host
                  value: staging.app.cadra.ng
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /web/login
              port: 8069
              httpHeaders:
                - name: Host
                  value: staging.app.cadra.ng
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
      volumes:
        - name: odoo-config
          configMap:
            name: odoo-config-19
        - name: odoo-filestore
          persistentVolumeClaim:
            claimName: odoo-19-filestore
