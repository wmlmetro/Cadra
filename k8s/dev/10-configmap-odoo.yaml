apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config
  namespace: cadra-dev
data:
  odoo.conf: |
    [options]
    ; ─── Dev Odoo configuration for Kubernetes ──────────────────────────
    ; db_user / db_password are appended at container start from the cadra-db
    ; Secret (see the command: block in the Deployment / Job). The pods
    ; override the image entrypoint, so its HOST/USER/PASSWORD injection does
    ; NOT run — credentials must be written here instead.
    ; NOTE: db_name is intentionally NOT set on the server — the database is
    ; chosen per-request by dbfilter (below). The bootstrap/upgrade JOBS still
    ; pin db_name to target one specific tenant DB.
    db_host = db
    db_port = 5432

    ; HTTP — both ports listened on inside the single pod.
    http_port = 8069
    longpolling_port = 8072
    http_interface = 0.0.0.0
    proxy_mode = True

    ; ─── Multi-tenant routing ───────────────────────────────────────────
    ; Select the database from the request host. %d = the first label of the
    ; host, so <client>.cadra.ng -> DB "<client>". The DB name MUST equal the
    ; subdomain label (e.g. staging.app.cadra.ng -> DB "staging",
    ; nrs.cadra.ng -> DB "nrs"). One pod serves every tenant DB.
    dbfilter = ^%d$

    without_demo = True

    ; Multi-tenant: hide the DB manager so one tenant can't enumerate or open
    ; another's database. New client DBs are created via the bootstrap Job
    ; (odoo -d <db> -i ...), not the web UI.
    list_db = False

    ; Logging — kubectl logs captures stdout.
    log_level = info

    ; Addons (custom modules + OCA bundle under dist/).
    addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/dist

    ; Resource limits — kept BELOW the pod's K8s memory limit so Odoo
    ; recycles workers before the kubelet OOMKills the pod.
    ;   soft = 1.25 GiB, hard = 1.5 GiB  (pod limit = 2 GiB)
    limit_memory_soft = 1342177280
    limit_memory_hard = 1610612736
    limit_request = 8192
    limit_time_cpu = 600
    limit_time_real = 1200

    ; admin_passwd is injected at runtime by the container entrypoint
    ; using ODOO_MASTER_PASSWORD from the cadra-odoo Secret.
