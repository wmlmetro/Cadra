# /etc/nginx/sites-available/myservice
# Generated by myservicenrs install.sh
# After SSL: certbot --nginx -d myservice.com.ng

upstream odoo        { server 127.0.0.1:8069; }
upstream odoochat    { server 127.0.0.1:8072; }

server {
    listen 80;
    server_name myservice.com.ng www.myservice.com.ng;

    if ($host = www.myservice.com.ng) {
        return 301 http://myservice.com.ng$request_uri;
    }

    access_log /var/log/nginx/myservice.access.log;
    error_log  /var/log/nginx/myservice.error.log;

    proxy_read_timeout    720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout    720s;

    # Portal homepage — served as static HTML
    location = / {
        root /var/www/html;
        index index.html;
        try_files $uri @odoo;
    }

    # Longpolling
    location /longpolling {
        proxy_pass http://odoochat;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # Everything else → Odoo
    location / {
        proxy_pass http://odoo;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_redirect off;
    }
    location @odoo {
        proxy_pass http://odoo;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # Static asset caching
    location ~* /web/static/ {
        proxy_cache_valid 200 90m;
        proxy_buffering   on;
        expires           864000;
        proxy_pass        http://odoo;
    }

    gzip on;
    gzip_min_length 1100;
    gzip_buffers    4 32k;
    gzip_types      text/plain text/xml text/css application/javascript application/json;
    gzip_vary       on;
}
