# Dev overrides for Cadra / myservicenrs.
#
# Use with the base compose:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Dev-specific behavior:
#   - postgres port 5432 exposed to host (for psql from your terminal)
#   - odoo longpoll port 8072 exposed to host (rare; nginx normally proxies it)
#   - nginx proxy on host port 8069 (HTTP only — no TLS)
#   - bind-mounts the repo into /mnt/extra-addons for hot-reload
#   - list_db=True on Odoo (the DB manager UI is reachable)
#   - admin_passwd defaults to "admin" if ODOO_MASTER_PASSWORD not set

services:
  proxy:
    image: nginx:alpine
    depends_on:
      odoo:
        # `service_started` not `service_healthy` — on a fresh DB odoo's
        # /web/login returns 5xx until bootstrap initialises it. We don't
        # want proxy startup to block on that bootstrap step.
        condition: service_started
    ports:
      - "8069:8069"
    volumes:
      - ./config/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      # Modern React SPA (built with BASE_PATH=/app/) served at /app/* — the
      # local equivalent of the staging `frontend` pod. Rebuild the bundle with
      # `BASE_PATH=/app/ npm run build` in Frontend/artifacts/nrs-asset-register.
      - ./Frontend/artifacts/nrs-asset-register/dist/public:/usr/share/nginx/html:ro
    healthcheck:
      # Use 127.0.0.1, not "localhost": in the alpine image localhost resolves
      # to IPv6 ::1 first, but nginx only listens on IPv4 — so "localhost"
      # gives a spurious "connection refused" and a permanently-unhealthy flag.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8069/web/login || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    ports:
      - "5432:5432"

  odoo:
    ports:
      - "8072:8072"
    volumes:
      - ./config/odoo.dev.conf:/etc/odoo/odoo.conf:ro
    # admin_passwd is set in config/odoo.dev.conf (dev default: "admin").
    # Override by setting ODOO_MASTER_PASSWORD in .env and editing the conf,
    # or by switching to the prod compose which injects it from env.
    command:
      - odoo
      - --workers=${ODOO_WORKERS:-2}
      - --max-cron-threads=${ODOO_MAX_CRON_THREADS:-1}
      # Multi-tenant host routing is OPT-IN. Default empty => Odoo falls back to
      # `db_name = odoo` (config/odoo.dev.conf) and serves that DB on any host,
      # so plain http://localhost:8069 and CI both work unchanged. To run all
      # tenants locally (staging/gtb/jaizbankplc → <db>.localhost:8069), set
      # `export ODOO_DBFILTER='^%d$'` before `docker compose ... up`.
      - --db-filter=${ODOO_DBFILTER:-}
