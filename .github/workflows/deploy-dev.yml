name: deploy-dev

# Deploys the Cadra platform to the DOKS cadra-dev namespace. Since the 15->19
# migration, this targets the Odoo 19 stack (cadra-odoo-19 image, odoo-19
# Deployment) — the 15 stack is retired (k8s/dev/41-odoo-deployment.yaml is
# replicas:0). It also builds+rolls the React SPA and keeps the shared
# resources (Secrets, ConfigMaps, Postgres, Ingress) current.
#
# On push to dev: build images, sync secrets, apply configmaps/postgres/pvc/
# service/ingress, and roll the FRONTEND (safe RollingUpdate). It does NOT roll
# odoo-19 on push — that uses Recreate + an RWO filestore, so a roll briefly
# interrupts EVERY live tenant. Roll the backend deliberately via
# workflow_dispatch (roll_odoo=true) or the deploy-19 workflow.
#
# Because the ConfigMaps are applied on every push and the backend is not
# rolled on every push, a config fix can be merged, applied, and silently not
# take effect — odoo-config-19 is a subPath mount (excluded from ConfigMap
# update propagation) and odoo-bootstrap-19 arrives via envFrom (fixed at
# process start). The last deploy step therefore compares the running pod
# against both ConfigMaps and FAILS THE JOB on a difference, naming the
# button to press. Loud, not automatic: rolling on every push would trade a
# silent no-op for an interruption of every live tenant on every merge.
#
# Required GitHub secrets: DIGITALOCEAN_ACCESS_TOKEN, POSTGRES_PASSWORD,
#   ODOO_MASTER_PASSWORD, CADRA_JWT_SECRET, CADRA_TEST_CLIENT_SECRET,
#   SMTP_PASS (opt), CADRA_EMAIL_RELAY_SECRET (opt),
#   CADRA_TURNSTILE_SECRET (opt).
# Required vars: DO_REGISTRY_NAME, DO_CLUSTER_NAME, POSTGRES_DB/USER (opt),
#   SMTP_* (opt), EMAIL_FROM (opt), CADRA_EMAIL_RELAY_URL (opt),
#   VITE_TURNSTILE_SITEKEY (opt).
#
# Turnstile is opt-in and the two halves must be set together: the sitekey is
# a build arg (baked into the frontend bundle) and the secret reaches Odoo via
# bootstrap. A secret with no sitekey locks everyone out of the login form.

on:
  push:
    branches: ["dev"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      roll_odoo:
        description: "Also roll the odoo-19 Deployment with the new image (briefly interrupts ALL live tenants — Recreate + RWO filestore). Off = build image only; backend roll happens via deploy-19."
        type: boolean
        default: false

# One concurrency group for all three cluster-touching workflows (R55).
# upgrade-19 scales odoo-19 to zero mid-run, and deploy-dev/deploy-19 end by
# reading the RUNNING odoo-19 pod to prove the ConfigMaps took effect. Run two
# of these at once and the guard fails with a question about whether the pod is
# up rather than an answer about the config. Queue, never cancel: killing a
# deploy mid-flight can leave the cluster on a half-applied manifest.
concurrency:
  group: cadra-cluster-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: cadra-odoo-19
  FRONTEND_IMAGE_NAME: cadra-frontend
  NAMESPACE: cadra-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Log into DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200
      - name: Compute image reference
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="registry.digitalocean.com/${{ vars.DO_REGISTRY_NAME }}/${IMAGE_NAME}:dev-${SHA_SHORT}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & push (Odoo 19 k8s image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.odoo.19.k8s
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            registry.digitalocean.com/${{ vars.DO_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:dev-latest
          cache-from: type=gha,scope=odoo19
          cache-to: type=gha,mode=max,scope=odoo19
          platforms: linux/amd64

  build-and-push-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Log into DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200
      - name: Compute image reference
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="registry.digitalocean.com/${{ vars.DO_REGISTRY_NAME }}/${FRONTEND_IMAGE_NAME}:dev-${SHA_SHORT}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: Frontend/artifacts/nrs-asset-register
          file: Frontend/artifacts/nrs-asset-register/Dockerfile
          push: true
          build-args: |
            VITE_TURNSTILE_SITEKEY=${{ vars.VITE_TURNSTILE_SITEKEY }}
          tags: |
            ${{ steps.meta.outputs.image }}
            registry.digitalocean.com/${{ vars.DO_REGISTRY_NAME }}/${{ env.FRONTEND_IMAGE_NAME }}:dev-latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          platforms: linux/amd64

  deploy:
    needs: [build-and-push, build-and-push-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Save DOKS kubeconfig
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 1200 "${{ vars.DO_CLUSTER_NAME }}"

      - name: Ensure namespace exists
        run: kubectl apply -f k8s/dev/00-namespace.yaml

      - name: Sync K8s Secrets from GitHub Secrets
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'staging' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'odoo' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ODOO_MASTER_PASSWORD: ${{ secrets.ODOO_MASTER_PASSWORD }}
          CADRA_JWT_SECRET: ${{ secrets.CADRA_JWT_SECRET }}
          CADRA_TEST_CLIENT_SECRET: ${{ secrets.CADRA_TEST_CLIENT_SECRET }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_ENCRYPTION: ${{ vars.SMTP_ENCRYPTION || 'starttls' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          CADRA_EMAIL_RELAY_URL: ${{ vars.CADRA_EMAIL_RELAY_URL }}
          CADRA_EMAIL_RELAY_SECRET: ${{ secrets.CADRA_EMAIL_RELAY_SECRET }}
          CADRA_TURNSTILE_SECRET: ${{ secrets.CADRA_TURNSTILE_SECRET }}
        run: |
          set -e
          : "${POSTGRES_PASSWORD:?GitHub secret POSTGRES_PASSWORD is required}"
          : "${ODOO_MASTER_PASSWORD:?GitHub secret ODOO_MASTER_PASSWORD is required}"
          : "${CADRA_JWT_SECRET:?GitHub secret CADRA_JWT_SECRET is required}"
          : "${CADRA_TEST_CLIENT_SECRET:?GitHub secret CADRA_TEST_CLIENT_SECRET is required}"

          kubectl -n "${NAMESPACE}" create secret generic cadra-db \
            --from-literal=POSTGRES_DB="${POSTGRES_DB}" \
            --from-literal=POSTGRES_USER="${POSTGRES_USER}" \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "${NAMESPACE}" create secret generic cadra-odoo \
            --from-literal=ODOO_MASTER_PASSWORD="${ODOO_MASTER_PASSWORD}" \
            --from-literal=CADRA_JWT_SECRET="${CADRA_JWT_SECRET}" \
            --from-literal=CADRA_TEST_CLIENT_SECRET="${CADRA_TEST_CLIENT_SECRET}" \
            --from-literal=SMTP_HOST="${SMTP_HOST}" \
            --from-literal=SMTP_PORT="${SMTP_PORT}" \
            --from-literal=SMTP_USER="${SMTP_USER}" \
            --from-literal=SMTP_PASS="${SMTP_PASS}" \
            --from-literal=SMTP_ENCRYPTION="${SMTP_ENCRYPTION}" \
            --from-literal=EMAIL_FROM="${EMAIL_FROM}" \
            --from-literal=CADRA_EMAIL_RELAY_URL="${CADRA_EMAIL_RELAY_URL}" \
            --from-literal=CADRA_EMAIL_RELAY_SECRET="${CADRA_EMAIL_RELAY_SECRET}" \
            --from-literal=CADRA_TURNSTILE_SECRET="${CADRA_TURNSTILE_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply 19 ConfigMaps + Postgres + filestore PVC + Service
        run: |
          kubectl apply -f k8s/dev/10-configmap-odoo-19.yaml
          kubectl apply -f k8s/dev/11-configmap-bootstrap-19.yaml
          kubectl apply -f k8s/dev/30-postgres-statefulset.yaml
          kubectl apply -f k8s/dev/31-postgres-service.yaml
          kubectl apply -f k8s/dev/40-odoo-19-pvc.yaml
          kubectl apply -f k8s/dev/42-odoo-19-service.yaml

      - name: Wait for Postgres ready
        run: kubectl -n "${NAMESPACE}" rollout status statefulset/db --timeout=5m

      - name: Apply Frontend Service + Deployment with new image
        env:
          FRONTEND_IMAGE: ${{ needs.build-and-push-frontend.outputs.image }}
        run: |
          kubectl apply -f k8s/dev/44-frontend-service.yaml
          sed "s|REPLACE_ME/cadra-frontend:dev|${FRONTEND_IMAGE}|g" k8s/dev/43-frontend-deployment.yaml | kubectl apply -f -

      - name: Apply Ingress
        run: kubectl apply -f k8s/dev/60-ingress.yaml

      # Deliberate backend roll only — Recreate + RWO filestore briefly
      # interrupts every live tenant, so we never do it automatically on push.
      - name: (Optional) Roll odoo-19 Deployment with new image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.roll_odoo == true }}
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -e
          # A sed that matches nothing applies a manifest with the placeholder
          # still in it and reports success, which is the same class of defect
          # the config guard below exists for. Check the render before applying.
          RENDERED=$(sed "s|REPLACE_ME/cadra-odoo-19:dev|${IMAGE}|g" k8s/dev/41-odoo-19-deployment.yaml)
          if printf '%s\n' "$RENDERED" | grep -q 'REPLACE_ME'; then
            echo "41-odoo-19-deployment.yaml still contains a REPLACE_ME placeholder after substitution:"
            printf '%s\n' "$RENDERED" | grep -n 'REPLACE_ME'
            echo "::error title=Deployment placeholder not substituted::sed left a REPLACE_ME in 41-odoo-19-deployment.yaml. Refusing to apply."
            exit 1
          fi
          printf '%s\n' "$RENDERED" | kubectl apply -f -
          kubectl -n "${NAMESPACE}" rollout status deployment/odoo-19 --timeout=10m

      - name: Wait for Frontend rollout
        run: kubectl -n "${NAMESPACE}" rollout status deployment/frontend --timeout=5m

      # A ConfigMap change that is applied but never picked up is this
      # programme's signature defect one layer up: the deploy goes green and
      # the cluster carries on running the old file. We chose LOUD over
      # automatic - see the reasoning in the step body.
      - name: Verify odoo-19 is running the ConfigMaps this run applied
        run: |
          set -euo pipefail

          # The two ConfigMaps applied above reach odoo-19 by routes Kubernetes does NOT
          # keep up to date:
          #   - odoo-config-19 is mounted with subPath (41-odoo-19-deployment.yaml), and
          #     subPath mounts are excluded from ConfigMap update propagation: the file
          #     inside a running pod never changes. The container then copies it to
          #     /tmp/odoo.conf at startup, so even a propagated update would need a
          #     restart to be read.
          #   - odoo-bootstrap-19 arrives via envFrom, and a process's environment is
          #     fixed when the process is created.
          # So `kubectl apply` on either one changes the cluster and changes nothing that
          # is running. We deliberately do NOT roll odoo-19 to fix that automatically:
          # it is strategy Recreate on an RWO filestore, so a roll briefly interrupts
          # EVERY live tenant, and interrupting the whole estate to pick up a comment
          # change would be a worse defect than the one this guards against. So the
          # choice is LOUD: compare, and fail. A deploy that reports success having
          # changed nothing is the one outcome we refuse to ship.
          #
          # This reads the RUNNING POD rather than a checksum annotation we stamp on the
          # Deployment, because upgrade-19.yml also applies 41-odoo-19-deployment.yaml
          # and does not stamp anything. A marker only some appliers set would go stale
          # after a routine tenant fan-out and train everyone to ignore a red build.
          #
          # The same guard is the last step of deploy-19.yml. Keep the two in step.

          ERR=$(mktemp)
          fail=0

          if ! kubectl -n "${NAMESPACE}" get deployment/odoo-19 >/dev/null 2>&1; then
            echo "There is no odoo-19 Deployment in namespace ${NAMESPACE}, so nothing this"
            echo "run applied is serving anything. Run the deploy-19 workflow to create it."
            echo "::error title=odoo-19 is not deployed::The 19 ConfigMaps were applied but there is no odoo-19 Deployment running them. Run the deploy-19 workflow."
            exit 1
          fi

          echo "--- odoo-config-19  ->  /etc/odoo/odoo.conf.template in the running pod"
          want=$(kubectl -n "${NAMESPACE}" get configmap odoo-config-19 -o json | jq -r '.data["odoo.conf"]')
          if ! have=$(kubectl -n "${NAMESPACE}" exec deploy/odoo-19 -c odoo -- cat /etc/odoo/odoo.conf.template 2>"$ERR"); then
            echo "    could not read the config out of the running odoo-19 pod:"
            sed 's/^/      /' "$ERR"
            echo "::error title=odoo-19 config could not be read::kubectl exec into odoo-19 failed - is the pod running? See the step log."
            exit 1
          fi
          if [ "$want" = "$have" ]; then
            echo "    matches."
          else
            echo "    MISMATCH - the pod is running an older odoo.conf.  (-) pod   (+) this commit"
            diff -u <(printf '%s\n' "$have") <(printf '%s\n' "$want") | tail -n +3 | sed 's/^/      /' || true
            fail=1
          fi

          echo "--- odoo-bootstrap-19  ->  the running pod's environment (envFrom)"
          # Values in this ConfigMap are single-line by construction; a multi-line value
          # would need a different separator here.
          entries=$(kubectl -n "${NAMESPACE}" get configmap odoo-bootstrap-19 -o json \
            | jq -r '.data | to_entries[] | "\(.key)\t\(.value)"')
          while IFS="$(printf '\t')" read -r key want_v; do
            [ -n "$key" ] || continue
            have_v=$(kubectl -n "${NAMESPACE}" exec deploy/odoo-19 -c odoo -- printenv "$key" 2>/dev/null || true)
            if [ "$want_v" = "$have_v" ]; then
              echo "    ${key} matches."
            else
              echo "    ${key} MISMATCH - pod has [${have_v}], odoo-bootstrap-19 says [${want_v}]"
              fail=1
            fi
          done <<EOF
          ${entries}
          EOF

          if [ "$fail" = "1" ]; then
          cat <<'MSG'

          The ConfigMaps in the cluster are this commit's. The running odoo-19 is not.
          Nothing above picked the change up, and nothing will until odoo-19 is rolled.

          To land it, either:
            - re-run deploy-dev from the Actions tab with roll_odoo = true, or
            - run the deploy-19 workflow with run_bootstrap = false.

          Both roll odoo-19, and both briefly interrupt EVERY live tenant - odoo-19 is
          strategy Recreate on an RWO filestore. That interruption is exactly why this
          is a deliberate button and not something a push does on its own.
          MSG
            echo "::error title=odoo-19 is running a stale config::The ConfigMaps this run applied are not the ones odoo-19 is running. Re-run deploy-dev with roll_odoo=true, or run deploy-19. The step log has the diff."
            exit 1
          fi

          echo
          echo "odoo-19 is running the ConfigMaps this commit applied."

      - name: Show pod state on failure
        if: failure()
        run: |
          kubectl -n "${NAMESPACE}" get pods,svc,ingress,pvc -o wide || true
          kubectl -n "${NAMESPACE}" describe deployment/odoo-19 || true
          kubectl -n "${NAMESPACE}" describe deployment/frontend || true
          echo "─── recent events ───"
          kubectl -n "${NAMESPACE}" get events --sort-by=.lastTimestamp | tail -30 || true
          echo "─── odoo-19 pod logs (last 200) ───"
          kubectl -n "${NAMESPACE}" logs -l app=odoo-19 --tail=200 --all-containers || true
          echo "─── frontend pod logs (last 100) ───"
          kubectl -n "${NAMESPACE}" logs -l app=frontend --tail=100 --all-containers || true
