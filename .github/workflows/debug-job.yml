name: debug-job

# Fetch logs + pod status for a (possibly failed) in-cluster Job, so we can see
# the real error and whether it was OOMKilled. Read-only. workflow_dispatch only.
# e.g. diagnose why cadra-bootstrap-19 (lasg19 install) keeps failing.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job name."
        type: string
        default: "cadra-bootstrap-19"

env:
  NAMESPACE: cadra-dev

concurrency:
  group: debug-job
  cancel-in-progress: false

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Save DOKS kubeconfig
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 1200 "${{ vars.DO_CLUSTER_NAME }}"

      - name: Job + pods overview
        env:
          J: ${{ inputs.job }}
        run: |
          echo "════════ JOB ${J} ════════"
          kubectl -n "$NAMESPACE" get job "$J" -o wide 2>&1 || true
          echo "── describe job (tail) ──"
          kubectl -n "$NAMESPACE" describe job "$J" 2>&1 | tail -30 || true
          echo "── pods (job-name=${J}) ──"
          kubectl -n "$NAMESPACE" get pods -l job-name="$J" -o wide 2>&1 || true

      - name: Pod container states (OOMKilled? exit codes?)
        env:
          J: ${{ inputs.job }}
        run: |
          for p in $(kubectl -n "$NAMESPACE" get pods -l job-name="$J" -o name 2>/dev/null); do
            echo "════ $p ════"
            echo "-- initContainers --"
            kubectl -n "$NAMESPACE" get "$p" -o jsonpath='{range .status.initContainerStatuses[*]}{.name}: state={.state} lastState={.lastState}{"\n"}{end}' 2>&1 || true
            echo ""
            echo "-- containers --"
            kubectl -n "$NAMESPACE" get "$p" -o jsonpath='{range .status.containerStatuses[*]}{.name}: state={.state} lastState={.lastState}{"\n"}{end}' 2>&1 || true
            echo ""
          done

      - name: Logs — install-modules (current + previous)
        env:
          J: ${{ inputs.job }}
        run: |
          echo "════════ install-modules logs (current) ════════"
          kubectl -n "$NAMESPACE" logs job/"$J" -c install-modules --tail=250 2>&1 | tail -150 || true
          echo "════════ install-modules logs (previous / crashed attempt) ════════"
          for p in $(kubectl -n "$NAMESPACE" get pods -l job-name="$J" -o name 2>/dev/null); do
            kubectl -n "$NAMESPACE" logs "$p" -c install-modules --previous --tail=250 2>&1 | tail -150 || true
          done

      - name: Logs — seed
        env:
          J: ${{ inputs.job }}
        run: |
          echo "════════ seed logs ════════"
          kubectl -n "$NAMESPACE" logs job/"$J" -c seed --tail=200 2>&1 | tail -120 || true
