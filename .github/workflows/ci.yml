name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

# Avoid stacking runs on a hot branch — newest push wins.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-and-test:
    # The deploy-readiness gate: bring the stack up cold, run the
    # bootstrap, run the pytest API suite. If this is green, the docs/api/
    # response captures live as a workflow artifact for inspection.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for the pytest test harness on the host)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Show docker + compose version (smoke)
        run: |
          docker --version
          docker compose version

      - name: Install pytest test deps
        run: pip install -r tests/requirements.txt

      - name: Seed .env from .env.example (CI uses dev defaults)
        run: cp .env.example .env

      - name: Bootstrap (build → install → seed → API client)
        run: |
          # Odoo 19 rebuild stack (docker-compose.19.yml). The 15 stack can no
          # longer install this branch — request_fields now pulls in the
          # 19-only myservice_request_core (<list> views).
          export CADRA_PROFILE=dev19
          # Pin CI run time by skipping the slow fleet seed.
          export CADRA_SEED_PROFILE=core
          # The database this job creates is a throwaway, and it says so IN
          # ITSELF. Both test suites refuse to run against a database not
          # marked `test` (handoff 25) — this is how CI satisfies that guard
          # without an exemption in it. There is no CI branch anywhere in the
          # guard: an exemption is how a guard acquires its first hole, and
          # the honest statement is that this database really is a test one.
          export CADRA_DATABASE_CLASS=test
          ./scripts/bootstrap.sh

      - name: No dead _sql_constraints reached the registry
        run: |
          # Odoo 19 removed `_sql_constraints` and creates nothing for it, so a
          # constraint declared that way silently ceases to exist — that is how
          # unique(asset_code) was lost, and it was found by someone reading a
          # log rather than by anything failing. tests/test_source_guards.py
          # parses our own modules; this covers the vendored trees it cannot,
          # because CI is the one place that boots a registry from a container
          # created in this same job — so its log is exactly one load and the
          # count is meaningful (on a long-lived container it is not).
          n=$(docker compose -f docker-compose.yml -f docker-compose.19.yml logs odoo \
              | grep -c "_sql_constraints' is no longer supported" || true)
          if [ "$n" != "0" ]; then
            echo "::error::$n dead _sql_constraints declaration(s) reached the Odoo 19 registry — they create NO constraint. See docs/constraint-audit.md."
            docker compose -f docker-compose.yml -f docker-compose.19.yml logs odoo \
              | grep "_sql_constraints' is no longer supported" | head -20
            exit 1
          fi
          echo "no dead _sql_constraints in the registry"

      - name: Show captured credentials (redacted) — sanity that bootstrap wrote them
        run: |
          # Per-tenant since handoff 04: secrets belong to a database, so
          # bootstrap writes docs/api/.creds.<db> rather than one shared file.
          # CI bootstraps the single DB named in .env.example.
          DB=$(grep -E '^POSTGRES_DB=' .env.example | cut -d= -f2-)
          CREDS="docs/api/.creds.${DB}"
          if [ ! -f "$CREDS" ]; then
            echo "FAIL: $CREDS was not written by bootstrap"
            ls -la docs/api/ || true
            exit 1
          fi
          # Print the file with secret values masked.
          sed -E 's/(SECRET=.{8}).+/\1...REDACTED.../' "$CREDS"

      - name: The database CI built is marked as a test database
        run: |
          # If this is missing, every suite below refuses and the failure
          # reads as a broken guard rather than an unstamped database. Check
          # it here, where the message can say which it is.
          DB=$(grep -E '^POSTGRES_DB=' .env.example | cut -d= -f2-)
          got=$(docker compose -f docker-compose.yml -f docker-compose.19.yml \
                exec -T db psql -U odoo -d "$DB" -tAc \
                "SELECT value FROM ir_config_parameter WHERE key = 'cadra.database_class'")
          if [ "$got" != "test" ]; then
            echo "::error::database '$DB' is marked '${got:-(unset)}', not 'test' — scripts/bootstrap.py ensure_database_class() did not stamp it. The suites will refuse."
            exit 1
          fi
          echo "database '$DB' is marked 'test'"

      - name: Seed the demo personas — the receipt gates need seven people
        run: |
          # Since handoff 58 the suite walks units through the receipt gates
          # with the switch ON, as the seven demo personas, because the
          # no-two-gates rule refuses one credential at the second gate
          # (`tests/gates.py`, `e2e/fixtures/gates.ts`). It FAILS, never
          # skips, without them — so CI seeds them the way every classified
          # tenant has them (handoff 46), rather than exempting itself. The
          # helper finds the file by the host it calls, `localhost` here.
          # The wrapper never prints a password; the file is gitignored and
          # not in the uploaded artifacts, and each password is masked too.
          DB=$(grep -E '^POSTGRES_DB=' .env.example | cut -d= -f2-)
          scripts/demo_personas.sh "$DB" seed
          awk '!/^#/ && NF == 3 {print "::add-mask::" $3}' "docs/api/.personas.${DB}"
          cp "docs/api/.personas.${DB}" docs/api/.personas.localhost
          echo "personas: $(grep -cv '^#' docs/api/.personas.localhost) seeded on '$DB'"

      - name: Run the pytest API suite
        run: pytest tests/ -v

      - name: Run the Odoo-native test suites (in-registry)
        run: |
          # 1,464 lines of Odoo TransactionCase tests existed and nothing ever
          # ran them: `pytest tests/` above is an HTTP client, and until now it
          # was the only thing CI invoked. `--test-enable` appears nowhere else
          # in this repository.
          #
          # That mattered concretely. myservice_workflow/tests/test_outbound_events.py
          # holds `test_the_drain_cron_exists_and_trigger_resolves_it` — the one
          # test in the whole repo that asserts a PRODUCTION TRIGGER exists
          # rather than calling the mechanism itself. It was written in handoff
          # 06 and had never been executed. Meanwhile the scheduler was dead on
          # every tenant and no test could see it, because every other delivery
          # test calls `_cron_drain_outbound_events()` directly.
          #
          # A test that invokes the thing under test cannot see that nothing
          # else invokes it. Running the tests that check the other half is the
          # cheap part — 72 tests, about 7 seconds.
          #
          # Odoo returns a non-zero exit code when the assertion report is
          # unsuccessful (service/server.py::preload_registries), so this step
          # genuinely gates. The container already binds 8069, hence the
          # alternate ports.
          # myservice_nrs_base hosts the one guard that needs a LIVE REGISTRY
          # rather than source: it walks `ir.cron` and resolves every
          # `state=code` call against its model. Handoff 08 found two crons on
          # `nrs19` and `jaizbankplc` scheduling methods that were not in the
          # code those databases ran — they arrived as database ROWS from an
          # unmerged branch, so no static guard over our XML could ever have
          # seen them. Only a test with a registry in front of it can.
          #
          # myservice_asset_register, myservice_request_fields,
          # myservice_security and myservice_fleet_maintenance carry the
          # stale-stored-compute tests, which move the clock with freezegun
          # and assert a stored field changes because TIME passed rather than
          # because its inputs did. Those need an ORM too.
          #
          # The last two are named rather than left to arrive on their own.
          # `-u` goes through button_upgrade(), which pulls in every installed
          # dependent, so they WOULD run transitively (security depends on
          # nrs_base, fleet_maintenance on request_fields). That is coverage
          # you cannot see, and it disappears the day either dependency
          # changes. This step exists because 1,464 lines of tests were
          # running nowhere; implicit is how that happens.
          #
          # `--workers=0` is load-bearing, not tidiness. `myservice_barcode_station`
          # carries an HttpCase, and under the prefork server HttpCase.setUpClass
          # reads `odoo.service.server.server.httpd.server_port` — which
          # PreforkServer does not have. Every test in such a class ERRORS in
          # setUpClass, and the run still reports "N tests" and exits 0, so the
          # suite looks green while proving nothing. odoo.conf sets workers = 2.
          # myservice_api is named for the same reason as the last two: it
          # depends on security and nrs_base, so `-u` on those already drags
          # it in and its HttpCases would run as invisible transitive
          # coverage that vanishes the day a dependency moves. Its tests
          # cover the record cap and the /auth/token failure causes — the
          # two things a partner integration meets first.
          #
          # myservice_request_core was added in handoff 18 and had NO tests
          # at all before it. `-u` upgrades a module and everything that
          # depends on it, so naming workflow/api/fields already drags core
          # in — but as invisible transitive coverage that vanishes the day
          # a dependency moves, which is the exact failure this whole step
          # exists to fix. Its tests hold the rule that a stage change is a
          # stage CHANGING: writing a request's current stage back over
          # itself used to append a `stage_changed` row to the request's own
          # audit trail and reset `date_moved`.
          #
          # myservice_identity was added in handoff 17 and is NOT optional
          # here. `-u` upgrades a module and everything that DEPENDS on it,
          # not its dependencies — `myservice_api` depends on identity, so
          # naming api drags in nothing of identity's. Its new tests cover
          # the Redhubs asset export and the SAP employee webhook, both of
          # which stood on a credential default committed to this repo, and
          # without this name every one of those tests runs nowhere. That is
          # the same failure mode this whole step exists to fix.
          DB=$(grep -E '^POSTGRES_DB=' .env.example | cut -d= -f2-)
          docker compose -f docker-compose.yml -f docker-compose.19.yml exec -T odoo \
            odoo -c /etc/odoo/odoo.conf -d "$DB" \
              -u myservice_workflow,myservice_asset_depreciation,myservice_nrs_base,myservice_asset_register,myservice_request_core,myservice_request_fields,myservice_security,myservice_fleet_maintenance,myservice_barcode_station,myservice_api,myservice_identity \
              --test-enable --stop-after-init --workers=0 \
              --http-port=8099 --gevent-port=8098

      - name: Upload test report + response captures (always — even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadra-test-artifacts-${{ github.run_id }}
          path: |
            docs/api/test-report.md
            docs/api/test-responses/
          retention-days: 14

      - name: Show docker logs on failure (for debugging)
        if: failure()
        run: |
          echo "─── odoo logs (last 200) ───"
          docker compose -f docker-compose.yml -f docker-compose.19.yml logs --tail=200 odoo || true
          echo ""
          echo "─── postgres logs (last 50) ───"
          docker compose -f docker-compose.yml -f docker-compose.19.yml logs --tail=50 db || true

  image-addons-complete:
    # Guard against a module that exists in the repo but never reaches the
    # deployed image. The dev/CI stacks bind-mount the whole repo, so a missing
    # COPY in Dockerfile.odoo.19.k8s is invisible until an upgrade fails in
    # cluster with "invalid module names, ignored: <module>" — which is exactly
    # how myservice_asset_depreciation broke the first staging rollout.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every in-house addon is baked into the k8s image
        run: |
          missing=0
          for dir in myservice_* cadra_brand_*; do
            [ -f "$dir/__manifest__.py" ] || continue
            if ! grep -qE "^COPY .*[[:space:]]$dir[[:space:]]" Dockerfile.odoo.19.k8s; then
              echo "::error file=Dockerfile.odoo.19.k8s::'$dir' has a __manifest__.py but is never COPYed into the image. Odoo will not see it in cluster."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo ""
            echo "Add a line to Dockerfile.odoo.19.k8s, e.g.:"
            echo "  COPY --chown=odoo:odoo <module> /mnt/extra-addons/<module>/"
            exit 1
          fi
          echo "All in-house addons are present in Dockerfile.odoo.19.k8s."

  commit-messages:
    # No commit carries an AI-attribution trailer (CLAUDE.md, "Git &
    # attribution policy"). Twice — reports 37 and 49 — a Step-0 commit went
    # out with the tool's default trailer before the rule was consulted;
    # handoff 50 ruling 3 made the rule mechanical. Only the NEW commits are
    # checked: 206 of the 209 commits reachable from dev predate the
    # mechanism and stay as the owner ruled, which is why this job must
    # never scan full history. The local half is scripts/git-hooks/commit-msg
    # (activated per clone with `git config core.hooksPath scripts/git-hooks`);
    # this job is the half that cannot be skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No new commit message carries an AI-attribution line
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
              # A new branch's push event has no usable `before`; compare
              # against dev, the branch every feature branch leaves from.
              git fetch origin dev --quiet || true
              range="origin/dev..HEAD"
            else
              range="$before..${{ github.sha }}"
            fi
          fi
          echo "checking commit messages in $range"
          ./scripts/check_commit_messages.sh --range "$range"

  prod-compose-lint:
    # Validate that the prod compose file is syntactically correct (cheap).
    # Doesn't actually bring it up — needs a real domain for Caddy.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Seed .env with dummy prod values for syntactic validation
        run: |
          cat > .env <<EOF
          POSTGRES_DB=odoo
          POSTGRES_USER=odoo
          POSTGRES_PASSWORD=ci-postgres-pw-not-used
          ODOO_MASTER_PASSWORD=ci-master-pw-not-used
          ODOO_WORKERS=4
          ODOO_MAX_CRON_THREADS=2
          CADRA_JWT_SECRET=ci-jwt-secret-not-used-just-for-config-parse-check
          CADRA_TEST_CLIENT_ID=test_client
          CADRA_TEST_CLIENT_SECRET=ci-client-secret-not-used
          CADRA_BOOTSTRAP_MODULES=myservice_api
          CADRA_DOMAIN=ci.example.com
          CADRA_ACME_EMAIL=ci@example.com
          CADRA_SEED_PROFILE=core
          EOF
      - name: docker compose config (prod)
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null
      - name: docker compose config (dev)
        run: docker compose -f docker-compose.yml -f docker-compose.19.yml config > /dev/null

      - name: Every profile resolves to the supported Odoo major
        run: |
          # The other half of tests/test_deployment_profile.py. That file
          # parses the compose YAML itself, because the pytest suite runs with
          # `pytest` and `requests` and nothing else and a guard that needs
          # the docker CLI is a guard that SKIPS where the CLI is missing.
          # This step is the same fact read from the REAL resolver, in the one
          # place docker genuinely exists — so neither reader can be wrong on
          # its own, and neither can go quiet.
          #
          # `prod` resolved to `cadra-odoo:15.0-dev` for the whole of the
          # Odoo 19 migration. It is the profile a CLIENT is deployed with,
          # CI builds and tests only 19, and myservice_request_core is
          # 19-only. Nothing caught it because nothing looked.
          expected=19
          fail=0
          check() {
            got=$(docker compose -f docker-compose.yml -f "$1" config                   --format json | python3 -c                   'import json,sys; print(json.load(sys.stdin)["services"]["odoo"]["image"])')
            case "$got" in
              *:"$expected".*) echo "  $2 -> $got" ;;
              *) echo "::error::profile '$2' resolves the odoo service to $got, not Odoo $expected. A client deployed by this profile gets that runtime."; fail=1 ;;
            esac
          }
          check docker-compose.19.yml dev
          check docker-compose.prod.yml prod
          exit $fail
