name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

# Avoid stacking runs on a hot branch — newest push wins.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-and-test:
    # The deploy-readiness gate: bring the stack up cold, run the
    # bootstrap, run the pytest API suite. If this is green, the docs/api/
    # response captures live as a workflow artifact for inspection.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for the pytest test harness on the host)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Show docker + compose version (smoke)
        run: |
          docker --version
          docker compose version

      - name: Install pytest test deps
        run: pip install -r tests/requirements.txt

      - name: Seed .env from .env.example (CI uses dev defaults)
        run: cp .env.example .env

      - name: Bootstrap (build → install → seed → API client)
        run: |
          # Odoo 19 rebuild stack (docker-compose.19.yml). The 15 stack can no
          # longer install this branch — request_fields now pulls in the
          # 19-only myservice_request_core (<list> views).
          export CADRA_PROFILE=dev19
          # Pin CI run time by skipping the slow fleet seed.
          export CADRA_SEED_PROFILE=core
          ./scripts/bootstrap.sh

      - name: No dead _sql_constraints reached the registry
        run: |
          # Odoo 19 removed `_sql_constraints` and creates nothing for it, so a
          # constraint declared that way silently ceases to exist — that is how
          # unique(asset_code) was lost, and it was found by someone reading a
          # log rather than by anything failing. tests/test_source_guards.py
          # parses our own modules; this covers the vendored trees it cannot,
          # because CI is the one place that boots a registry from a container
          # created in this same job — so its log is exactly one load and the
          # count is meaningful (on a long-lived container it is not).
          n=$(docker compose -f docker-compose.yml -f docker-compose.19.yml logs odoo \
              | grep -c "_sql_constraints' is no longer supported" || true)
          if [ "$n" != "0" ]; then
            echo "::error::$n dead _sql_constraints declaration(s) reached the Odoo 19 registry — they create NO constraint. See docs/constraint-audit.md."
            docker compose -f docker-compose.yml -f docker-compose.19.yml logs odoo \
              | grep "_sql_constraints' is no longer supported" | head -20
            exit 1
          fi
          echo "no dead _sql_constraints in the registry"

      - name: Show captured credentials (redacted) — sanity that bootstrap wrote them
        run: |
          # Per-tenant since handoff 04: secrets belong to a database, so
          # bootstrap writes docs/api/.creds.<db> rather than one shared file.
          # CI bootstraps the single DB named in .env.example.
          DB=$(grep -E '^POSTGRES_DB=' .env.example | cut -d= -f2-)
          CREDS="docs/api/.creds.${DB}"
          if [ ! -f "$CREDS" ]; then
            echo "FAIL: $CREDS was not written by bootstrap"
            ls -la docs/api/ || true
            exit 1
          fi
          # Print the file with secret values masked.
          sed -E 's/(SECRET=.{8}).+/\1...REDACTED.../' "$CREDS"

      - name: Run the pytest API suite
        run: pytest tests/ -v

      - name: Upload test report + response captures (always — even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadra-test-artifacts-${{ github.run_id }}
          path: |
            docs/api/test-report.md
            docs/api/test-responses/
          retention-days: 14

      - name: Show docker logs on failure (for debugging)
        if: failure()
        run: |
          echo "─── odoo logs (last 200) ───"
          docker compose -f docker-compose.yml -f docker-compose.19.yml logs --tail=200 odoo || true
          echo ""
          echo "─── postgres logs (last 50) ───"
          docker compose -f docker-compose.yml -f docker-compose.19.yml logs --tail=50 db || true

  image-addons-complete:
    # Guard against a module that exists in the repo but never reaches the
    # deployed image. The dev/CI stacks bind-mount the whole repo, so a missing
    # COPY in Dockerfile.odoo.19.k8s is invisible until an upgrade fails in
    # cluster with "invalid module names, ignored: <module>" — which is exactly
    # how myservice_asset_depreciation broke the first staging rollout.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every in-house addon is baked into the k8s image
        run: |
          missing=0
          for dir in myservice_* cadra_brand_*; do
            [ -f "$dir/__manifest__.py" ] || continue
            if ! grep -qE "^COPY .*[[:space:]]$dir[[:space:]]" Dockerfile.odoo.19.k8s; then
              echo "::error file=Dockerfile.odoo.19.k8s::'$dir' has a __manifest__.py but is never COPYed into the image. Odoo will not see it in cluster."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo ""
            echo "Add a line to Dockerfile.odoo.19.k8s, e.g.:"
            echo "  COPY --chown=odoo:odoo <module> /mnt/extra-addons/<module>/"
            exit 1
          fi
          echo "All in-house addons are present in Dockerfile.odoo.19.k8s."

  prod-compose-lint:
    # Validate that the prod compose file is syntactically correct (cheap).
    # Doesn't actually bring it up — needs a real domain for Caddy.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Seed .env with dummy prod values for syntactic validation
        run: |
          cat > .env <<EOF
          POSTGRES_DB=odoo
          POSTGRES_USER=odoo
          POSTGRES_PASSWORD=ci-postgres-pw-not-used
          ODOO_MASTER_PASSWORD=ci-master-pw-not-used
          ODOO_WORKERS=4
          ODOO_MAX_CRON_THREADS=2
          CADRA_JWT_SECRET=ci-jwt-secret-not-used-just-for-config-parse-check
          CADRA_TEST_CLIENT_ID=test_client
          CADRA_TEST_CLIENT_SECRET=ci-client-secret-not-used
          CADRA_BOOTSTRAP_MODULES=myservice_api
          CADRA_DOMAIN=ci.example.com
          CADRA_ACME_EMAIL=ci@example.com
          CADRA_SEED_PROFILE=core
          EOF
      - name: docker compose config (prod)
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null
      - name: docker compose config (dev)
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config > /dev/null
      - name: docker compose config (dev19 — Odoo 19 rebuild stack)
        run: docker compose -f docker-compose.yml -f docker-compose.19.yml config > /dev/null
