name: drop-db

# DESTRUCTIVE: drop a database on the shared Postgres. Intended for the rollback
# backup DBs after the migration soak (staging_15bak, gtb_15bak,
# jaizbankplc_15bak, lasg_preflip, lasg_15bak). Gated behind a typed confirm so
# it can't fire by accident. workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      db:
        description: "Database to DROP (e.g. gtb_15bak)."
        type: string
        required: true
      confirm:
        description: "Type the EXACT db name again to confirm the drop."
        type: string
        required: true

env:
  NAMESPACE: cadra-dev

concurrency:
  group: drop-db
  cancel-in-progress: false

jobs:
  drop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: dev
    steps:
      - name: Guard — confirm matches, and refuse live tenant DBs
        run: |
          set -e
          DB='${{ inputs.db }}'
          CONFIRM='${{ inputs.confirm }}'
          if [ "$DB" != "$CONFIRM" ]; then
            echo "confirm ('$CONFIRM') does not match db ('$DB') — aborting." >&2; exit 1
          fi
          case "$DB" in
            staging|gtb|jaizbankplc|lasg|odoo|postgres|template0|template1)
              echo "REFUSING to drop live/system DB '$DB'." >&2; exit 1;;
          esac
          echo "will drop: $DB"
      - uses: actions/checkout@v4
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Save DOKS kubeconfig
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 1200 "${{ vars.DO_CLUSTER_NAME }}"
      - name: Drop the database
        env:
          PGUSER: ${{ vars.POSTGRES_USER || 'odoo' }}
          DB: ${{ inputs.db }}
        run: |
          set -e
          POD=$(kubectl -n "$NAMESPACE" get pod -l app=db -o jsonpath='{.items[0].metadata.name}')
          echo "── before ──"
          kubectl -n "$NAMESPACE" exec "$POD" -- psql -U "$PGUSER" -d postgres -tAc \
            "SELECT datname, pg_size_pretty(pg_database_size(datname)) FROM pg_database WHERE datname='$DB';"
          # Terminate any connections, then drop.
          kubectl -n "$NAMESPACE" exec "$POD" -- psql -U "$PGUSER" -d postgres -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='$DB';"
          kubectl -n "$NAMESPACE" exec "$POD" -- psql -U "$PGUSER" -d postgres -c "DROP DATABASE IF EXISTS \"$DB\";"
          echo "── remaining backup DBs ──"
          kubectl -n "$NAMESPACE" exec "$POD" -- psql -U "$PGUSER" -d postgres -tAc \
            "SELECT datname FROM pg_database WHERE datname LIKE '%\_15bak' OR datname LIKE '%\_preflip' ORDER BY 1;"
