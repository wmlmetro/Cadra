name: nrs-import

# Run the one-off NRS master-data import as an in-cluster Job. Prereqs:
#   1. staging19 bootstrapped (deploy-19: run_bootstrap=true bootstrap_db=staging19
#      bootstrap_extra_modules=cadra_brand_nrs bootstrap_seed_profile=core).
#   2. cadra-nrs-import image built + pushed to the DO registry (nrs-import-image.yml
#      or a local build) — pass its ref as the `image` input.
#
# workflow_dispatch only. Reproduces ~11.4k employees + ~11.9k assets on
# staging19 (location bridge + asset/employee import via odoo-19 XML-RPC). The
# import is idempotent (load() updates), so re-running is safe; this workflow
# also PRE-CHECKS staging19 and skips the ~45m import if it is already loaded.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Full cadra-nrs-import image ref (registry.digitalocean.com/<reg>/cadra-nrs-import:<tag>)."
        type: string
        required: true
      target_db:
        description: "Target 19 DB."
        type: string
        default: "staging19"
      source_db:
        description: "Live 15 DB to export the location tree from."
        type: string
        default: "staging"
      force:
        description: "Re-run the import even if staging19 already looks loaded."
        type: boolean
        default: false

env:
  NAMESPACE: cadra-dev

concurrency:
  group: nrs-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Save DOKS kubeconfig
        # 2h token — the import runs ~45m+; a short token expires mid-run and
        # kubectl loses auth (the original failure mode).
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 7200 "${{ vars.DO_CLUSTER_NAME }}"

      - name: Pre-check — the admin credential exists in the cluster
        # The Job reads ODOO_ADMIN_PW from cadra-odoo/ODOO_ADMIN_PASSWORD. If
        # that key is absent the pod sits in CreateContainerConfigError, which
        # is a correct refusal and an opaque one — the run streams no logs and
        # times out an hour later. Fail here instead, naming the key. The
        # credential used to be baked into the image as `admin`, so on a
        # cluster set up before handoff 18 this key does not exist yet.
        run: |
          set -e
          if ! kubectl -n "$NAMESPACE" get secret cadra-odoo \
               -o jsonpath='{.data.ODOO_ADMIN_PASSWORD}' | grep -q .; then
            echo "::error::cadra-odoo has no ODOO_ADMIN_PASSWORD key. That is"
            echo "::error::the Odoo admin USER password the import uses for"
            echo "::error::XML-RPC (not ODOO_MASTER_PASSWORD). Add it with:"
            echo "::error::  kubectl -n $NAMESPACE patch secret cadra-odoo --type merge -p '{\"stringData\":{\"ODOO_ADMIN_PASSWORD\":\"<password>\"}}'"
            exit 1
          fi
          echo "cadra-odoo/ODOO_ADMIN_PASSWORD is present."

      - name: Pre-check — is staging19 already imported?
        id: precheck
        env:
          PGUSER: ${{ vars.POSTGRES_USER || 'odoo' }}
          TARGET_DB: ${{ inputs.target_db }}
        run: |
          set -e
          POD=$(kubectl -n "$NAMESPACE" get pod -l app=db -o jsonpath='{.items[0].metadata.name}')
          EMP=$(kubectl -n "$NAMESPACE" exec "$POD" -- psql -U "$PGUSER" -d "$TARGET_DB" -tAc \
            "SELECT count(*) FROM hr_employee" 2>/dev/null | tr -d '[:space:]' || echo 0)
          AST=$(kubectl -n "$NAMESPACE" exec "$POD" -- psql -U "$PGUSER" -d "$TARGET_DB" -tAc \
            "SELECT count(*) FROM nrs_asset" 2>/dev/null | tr -d '[:space:]' || echo 0)
          echo "staging19 currently: employees=$EMP assets=$AST"
          if [ "${EMP:-0}" -ge 11000 ] && [ "${AST:-0}" -ge 11000 ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "Already loaded — skipping the import Job (pass force=true to redo)."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cadra-nrs-import Job
        if: steps.precheck.outputs.done != 'true'
        env:
          IMAGE: ${{ inputs.image }}
          TARGET_DB: ${{ inputs.target_db }}
          SOURCE_DB: ${{ inputs.source_db }}
        run: |
          set -e
          kubectl -n "${NAMESPACE}" delete job cadra-nrs-import --ignore-not-found
          sed -e "s|REPLACE_ME_IMAGE|${IMAGE}|g" \
              -e "s|value: \"staging19\"|value: \"${TARGET_DB}\"|" \
              -e "s|value: \"staging\"       # live 15 DB to export locations from|value: \"${SOURCE_DB}\"|" \
              k8s/dev/71-nrs-import-job.yaml | kubectl apply -f -
          sleep 8
          # Stream logs (best-effort); then poll the Job status until it finishes.
          kubectl -n "${NAMESPACE}" logs -f job/cadra-nrs-import --all-containers || true
          for i in $(seq 1 100); do
            SUCC=$(kubectl -n "${NAMESPACE}" get job cadra-nrs-import -o jsonpath='{.status.succeeded}' 2>/dev/null || echo)
            FAIL=$(kubectl -n "${NAMESPACE}" get job cadra-nrs-import -o jsonpath='{.status.failed}' 2>/dev/null || echo)
            if [ "${SUCC:-0}" = "1" ]; then echo "Job succeeded."; break; fi
            if [ -n "${FAIL}" ] && [ "${FAIL}" -ge 1 ] 2>/dev/null; then
              echo "Job failed."; kubectl -n "${NAMESPACE}" logs job/cadra-nrs-import --all-containers --tail=60; exit 1
            fi
            sleep 60
          done

      - name: Verify staging19 counts + 19 signature
        env:
          PGUSER: ${{ vars.POSTGRES_USER || 'odoo' }}
          TARGET_DB: ${{ inputs.target_db }}
        run: |
          set -e
          POD=$(kubectl -n "$NAMESPACE" get pod -l app=db -o jsonpath='{.items[0].metadata.name}')
          echo "── staging19 counts ──"
          kubectl -n "$NAMESPACE" exec "$POD" -- psql -U "$PGUSER" -d "$TARGET_DB" -tAc \
            "SELECT 'employees',count(*) FROM hr_employee UNION ALL SELECT 'assets',count(*) FROM nrs_asset UNION ALL SELECT 'locations',count(*) FROM generic_location UNION ALL SELECT 'assets_on_real_loc',count(*) FROM nrs_asset a WHERE a.location_id IN (SELECT res_id FROM ir_model_data WHERE name LIKE 'nrs_loc_%' AND model='generic.location');"
          echo "── 19 signature ──"
          kubectl -n "$NAMESPACE" exec "$POD" -- psql -U "$PGUSER" -d "$TARGET_DB" -tAc \
            "SELECT name,state FROM ir_module_module WHERE name='myservice_request_core';"
