name: nrs-import-image

# Builds + pushes the cadra-nrs-import image in CI, pulling the gitignored
# NRS_asset_seed pack from a PRIVATE GitHub Release asset (private repo → the
# asset is only reachable by collaborators + the Actions GITHUB_TOKEN). This
# keeps the pack out of git history while letting CI (which holds the DO token)
# do the registry push.
#
# Prereq — upload the pack ONCE (you, locally, since it holds real staff PII):
#   tar czf nrs_asset_seed.tar.gz -C docs/seed NRS_asset_seed
#   gh release create nrs-pack-internal nrs_asset_seed.tar.gz -R wmlmetro/Cadra \
#     --prerelease --title "Internal: NRS import pack (delete after cutover)" \
#     --notes "delete after: gh release delete nrs-pack-internal --cleanup-tag"
#
# After this workflow succeeds, run nrs-import.yml with the printed image ref,
# then delete the release: gh release delete nrs-pack-internal --cleanup-tag -y
#
# workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      pack_release_tag:
        description: "GitHub Release tag holding the pack tarball."
        type: string
        default: "nrs-pack-internal"
      pack_asset:
        description: "Asset filename in that release."
        type: string
        default: "nrs_asset_seed.tar.gz"

env:
  IMAGE_NAME: cadra-nrs-import

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the NRS pack from the private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download "${{ inputs.pack_release_tag }}" -R "${{ github.repository }}" \
            -p "${{ inputs.pack_asset }}" -O /tmp/pack.tar.gz
          mkdir -p docs/seed
          tar xzf /tmp/pack.tar.gz -C docs/seed
          test -f docs/seed/NRS_asset_seed/02_employees/IMPORT_employees_hr_employee.csv \
            || { echo "FATAL: pack missing expected CSVs" >&2; exit 1; }
          echo "pack extracted:"; ls docs/seed/NRS_asset_seed

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Log into DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Compute image reference
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="registry.digitalocean.com/${{ vars.DO_REGISTRY_NAME }}/${IMAGE_NAME}:${SHA_SHORT}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nrs-import
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            registry.digitalocean.com/${{ vars.DO_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64

      - name: Next step
        run: |
          echo "Pushed ${{ steps.meta.outputs.image }}"
          echo "Now run:  gh workflow run nrs-import.yml -f image=${{ steps.meta.outputs.image }}"
          echo "Then delete the pack release:  gh release delete ${{ inputs.pack_release_tag }} --cleanup-tag -y"
