# Base docker-compose for Cadra / myservicenrs.
#
# This file alone does nothing useful — it's always combined with one of:
#   docker-compose.19.yml    (local development: nginx, exposed ports, no TLS)
#   docker-compose.prod.yml  (single-tenant client server: Caddy + Let's Encrypt)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.19.yml   up -d
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# There is ONE runtime and it is Odoo 19. The base used to build
# `cadra-odoo:15.0-dev` from `FROM odoo:15.0` and only the 19 overlay
# overrode it, so `prod` — the profile a client is actually deployed with —
# resolved to a runtime CI never builds and which cannot load this repo's own
# modules (myservice_request_core is 19-only). Nothing had been deployed that
# way, which is the only reason it survived two handoffs. Pinning the version
# HERE rather than in one overlay is what makes a future overlay inherit the
# right runtime instead of having to remember to ask for it, and
# tests/test_deployment_profile.py fails if any profile resolves to another
# major.
#
# All sensitive values come from .env (see .env.example).

services:
  db:
    image: postgres:13
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - cadra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-odoo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  odoo:
    build:
      context: .
      dockerfile: Dockerfile.odoo.19.dev
    image: cadra-odoo:19.0-dev
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      # Forwarded to bootstrap.py / odoo shell scripts
      CADRA_JWT_SECRET: ${CADRA_JWT_SECRET:-}
      CADRA_TEST_CLIENT_ID: ${CADRA_TEST_CLIENT_ID:-test_client}
      CADRA_TEST_CLIENT_SECRET: ${CADRA_TEST_CLIENT_SECRET:-}
      CADRA_BOOTSTRAP_MODULES: ${CADRA_BOOTSTRAP_MODULES:-}
      CADRA_SEED_PROFILE: ${CADRA_SEED_PROFILE:-core}
      # Handoff 25. `bootstrap.py` records what kind of database it is
      # provisioning (`cadra.database_class`), and both test suites
      # refuse any database not marked `test`. These two decide it, and
      # they are read INSIDE the container — `docker compose run`
      # forwards only what this block names, so omitting them makes
      # `ensure_database_class()` dead code on every path that matters.
      CADRA_DATABASE_CLASS: ${CADRA_DATABASE_CLASS:-}
      CADRA_PROFILE: ${CADRA_PROFILE:-}
      # Optional HTTPS email relay (for DO clusters where SMTP egress is
      # blocked). Both blank → ir.mail_server uses native SMTP.
      CADRA_EMAIL_RELAY_URL: ${CADRA_EMAIL_RELAY_URL:-}
      CADRA_EMAIL_RELAY_SECRET: ${CADRA_EMAIL_RELAY_SECRET:-}
      CADRA_TURNSTILE_SECRET: ${CADRA_TURNSTILE_SECRET:-}
      # Handoff 64: the provider key for Identify from photo — the owner's.
      # Empty leaves whatever a tenant holds alone (bootstrap is one-way).
      CADRA_AI_API_KEY: ${CADRA_AI_API_KEY:-}
    volumes:
      - ./:/mnt/extra-addons:ro
      - cadra_odoo_data:/var/lib/odoo
    healthcheck:
      # /web/login is the universal "Odoo is up" check — returns 200 once
      # the registry is loaded. Cheaper than hitting /api/v1/openapi.json.
      # Use python3 (always present in the Odoo image) since wget/curl are not.
      test: ["CMD-SHELL", "python3 -c 'import urllib.request,sys; urllib.request.urlopen(\"http://localhost:8069/web/login\", timeout=3)' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

volumes:
  cadra_pgdata:
  cadra_odoo_data:
