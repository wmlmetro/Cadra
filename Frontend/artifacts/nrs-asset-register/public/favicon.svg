<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- NRS brand-red rounded square + bold white "NRS" mark.
       Designed for max legibility at 16x16 tab favicon size; SVG keeps
       it sharp on retina and resolves any DPR. -->
  <rect width="32" height="32" rx="6" fill="#E01F26"/>
  <text x="16" y="22"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="13"
        letter-spacing="-0.5"
        fill="#FFFFFF">NRS</text>
</svg>
