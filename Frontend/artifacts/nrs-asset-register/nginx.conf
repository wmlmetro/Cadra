worker_processes 1;

events { worker_connections 512; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Compact log to stdout — the K8s pod is the only consumer.
  log_format compact '$remote_addr "$request" $status ${body_bytes_sent}B "$http_user_agent"';
  access_log /dev/stdout compact;
  error_log  /dev/stderr warn;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  server {
    listen 8080 default_server;
    server_name _;

    # Hashed assets are immutable — long cache.
    location ~ ^/app/assets/ {
      root /usr/share/nginx/html;
      rewrite ^/app/(.*)$ /$1 break;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # SPA shell. Any sub-path under /app that isn't an asset returns
    # index.html so wouter / react-router can handle client-side routing.
    location /app/ {
      root /usr/share/nginx/html;
      rewrite ^/app/(.*)$ /$1 break;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }

    # Exact /app redirects to /app/ so wouter's BASE_URL handling is happy.
    location = /app {
      return 301 /app/;
    }

    # Kubernetes probes hit here directly; everything else goes through the
    # Ingress, which only routes /app/* to this Service.
    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # Any other request hitting this pod (shouldn't happen via Ingress)
    # gets a 404 rather than leaking the index.
    location / {
      return 404;
    }
  }
}
