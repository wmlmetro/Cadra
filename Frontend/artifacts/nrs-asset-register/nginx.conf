worker_processes 1;

events { worker_connections 512; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Compact log to stdout — the K8s pod is the only consumer.
  log_format compact '$remote_addr "$request" $status ${body_bytes_sent}B "$http_user_agent"';
  access_log /dev/stdout compact;
  error_log  /dev/stderr warn;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  server {
    listen 8080 default_server;
    server_name _;

    # The Ingress terminates TLS and forwards as plain HTTP on port 8080.
    # Without these, nginx writes absolute redirects with the upstream
    # port (e.g. http://host:8080/app/), which the browser then can't
    # reach. Returning relative URIs lets the Ingress reapply the right
    # scheme/host/port.
    absolute_redirect off;
    port_in_redirect  off;

    # K8s readiness + liveness probes hit /healthz directly on the pod
    # IP — never via the Ingress.
    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # /app → /app/ so wouter's base URL handling is happy.
    location = /app {
      return 301 /app/;
    }

    # Hashed JS/CSS bundles — long immutable cache. `^~` keeps this block
    # winning over the regex-equivalent SPA block below.
    location ^~ /app/assets/ {
      alias /usr/share/nginx/html/assets/;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # SPA shell. `alias` strips the /app/ prefix; the trailing /app/index.html
    # fallback re-enters this same location so the served file is the bundle's
    # index.html.
    location /app/ {
      alias /usr/share/nginx/html/;
      add_header Cache-Control "no-cache" always;
      try_files $uri /app/index.html;
    }
  }
}
