<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Brand-neutral defaults; the real per-tenant title is set at runtime by
         applyBrand() (src/lib/brand.ts) from GET /api/v1/brand. -->
    <title>Cadra</title>
    <meta name="description" content="Cadra — assets, service desk, fleet, locations, and identity in one place." />
    <meta name="author" content="WestMetro Limited" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="Cadra" />
    <meta property="og:title" content="Cadra" />
    <meta property="og:description" content="Cadra — assets, service desk, fleet, locations, and identity in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cadra" />
    <meta name="twitter:description" content="Cadra — assets, service desk, fleet, locations, and identity in one place." />
    <meta name="twitter:image" content="/opengraph.jpg" />
    <!-- Square NRS favicon. The bundled nrs-logo.png is the wide horizontal
         wordmark (2256x584) which squashes to an unreadable smear at 16x16;
         /favicon.svg is a square red-on-white "NRS" mark designed for tab
         scale. SVG primary keeps it sharp on retina; PNG kept as a fallback
         for stack-bottom clients. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/nrs-logo.png" />
    <link rel="apple-touch-icon" href="/nrs-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
