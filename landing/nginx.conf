# Cadra landing page — the server block for https://cadra.ng/.
# Mounted as /etc/nginx/conf.d/default.conf in the stock
# nginxinc/nginx-unprivileged image (k8s/dev/45-landing-deployment.yaml), whose
# own nginx.conf supplies the pid/temp paths a non-root nginx needs. The
# Ingress terminates TLS and forwards plain HTTP to 8080.
server {
  listen 8080 default_server;
  server_name _;

  absolute_redirect off;
  port_in_redirect  off;
  server_tokens     off;

  gzip on;
  gzip_types text/plain text/css application/javascript image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  root /usr/share/nginx/html;

  # Probes hit the pod IP directly, never through the Ingress.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # An add_header inside a location replaces every one inherited from the
  # server block, so each location carries the full set.
  location = / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files /index.html =404;
  }

  # The CSS and JS are not fingerprinted, so they revalidate on every load
  # rather than being cached for a year. The logo can keep for a day.
  location /assets/ {
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
}
