[options]
admin_passwd = admin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; db_name is deliberately NOT set — see k8s/dev/10-configmap-odoo-19.yaml,
; which has always left it out for the same reason.
;
; It does two jobs at once and only one of them was ever wanted here: it
; restricts which databases HTTP exposes, AND it pins the cron worker to that
; same list — `cron_database_list()` in odoo/service/server.py is literally
; `config['db_name'] or list_dbs(True)`. While this file said `db_name = odoo`
; the scheduler served exactly one database, and on this stack that one is a
; leftover 15-era database (base 15.0.1.3) which a 19 worker skips as
; incompatible. Net effect: no ir.cron ran on any tenant, ever. INT-05
; delivery, depreciation, PM and the token GC were all dormant.
;
; Exposure is the dbfilter's job alone now (`--db-filter`, passed by
; docker-compose.19.yml from ODOO_DBFILTER; `^odoo$` reproduces the old
; single-database behaviour, `^%d$` routes by host label). dbfilter does not
; narrow `list_dbs`, so the cron worker enumerates every database on the
; server whatever the filter says — which is the point.

http_port = 8069
; Odoo 16+ replaced longpolling_port with gevent_port; websocket traffic
; (/websocket/) is served on this port in a multi-worker setup.
gevent_port = 8072
http_interface = 0.0.0.0
proxy_mode = True
without_demo = True
log_level = info

; Default Odoo 19 addons + this repo (root) + the CRND 19 foundation (crnd-19)
; + the legacy 15.0 vendor tree (dist) is intentionally NOT on the path here —
; the rebuild installs a trimmed, ported module set, not the old dist/ bundle.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/crnd-19,/mnt/extra-addons/oca-19

; Dev convenience
list_db = True

; Odoo's weekly phone-home, pointed at a closed port.
;
; `mail.ir_cron_module_update_notification` POSTs to
; http://services.odoo.com/publisher-warranty/ once a week, per database. Its
; payload (mail/models/update.py:_get_message) is the database name and uuid,
; web.base.url, the installed app list, user counts — and the company's name,
; email and phone. Across the local tenants that is "Nigeria Revenue Service",
; "Guaranty Trust Bank", "Jaiz Bank Plc" and "Lagos State Ministry of Health",
; disclosed to a third party from a developer's laptop.
;
; It never ran here only because the scheduler was pinned to one dead database
; — nothing about it was ever a decision, and the first tick after this fix
; attempted it on seven tenants at once.
;
; This is the durable half of the defence: whatever the cron row says, the
; payload cannot leave the machine. The cron row itself is ALSO deactivated on
; each local tenant, because the server action is `model.update_notification(None)`
; — cron_mode falsy — so it raises rather than returning False, and a closed
; port alone would mean a weekly ERROR and a climbing `failure_count` on every
; database. Belt and braces, and no recurring noise.
;
; The cluster is no longer the open half of this. Its config has no db_name,
; so the cron HAS been running there weekly all along and those POSTs did go
; out; handoff 09 ruled that client identity for a national revenue service,
; two banks and a state ministry is not ours to disclose to a third party as a
; side effect of a default nobody chose. k8s/dev/10-configmap-odoo-19.yaml now
; sets this same option, and myservice_nrs_base deactivates the cron row per
; tenant through the upgrade fan-out.
;
; Merging that does NOT apply it: the ConfigMap is mounted with subPath, which
; Kubernetes excludes from update propagation, and the only step that rolls
; odoo-19 is workflow_dispatch-gated. It takes a deliberate roll.
publisher_warranty_url = http://localhost:1/publisher-warranty/

workers = 2

; One cron worker for every database on the server. That is enough here and
; the reasoning is worth keeping: WorkerCron processes ONE database per
; `process_work()` call and only really sleeps once its queue is empty
; (odoo/service/server.py), so a single thread walks every tenant per cycle
; rather than one tenant per minute. `ir.cron._trigger` sends a NOTIFY that
; both interrupts the sleep and puts the triggered database at the head of the
; queue, so INT-05 delivery does not queue behind seven idle tenants. It also
; matches k8s/dev/41-odoo-19-deployment.yaml, so local behaviour stays
; representative of the cluster's. The cost of one thread is head-of-line
; blocking while a genuinely long job runs; measured, the whole estate's work
; is seconds.
max_cron_threads = 1

; The cron watchdog, separated from the HTTP one.
;
; `limit_time_real_cron` defaults to -1, which means "use limit_time_real",
; which itself defaults to 120s — so a cron job running longer than two
; minutes has its worker SIGKILLed and its transaction rolled back, forever,
; on every retry. That was survivable while the scheduler was pinned to one
; empty database. It is not survivable on the first tick after this fix, which
; has weeks of catch-up in it (an 11k-row HR recompute and a 114k-attachment
; filestore walk on nrs19 alone). 1200 is what k8s/dev/10-configmap-odoo-19.yaml
; already gives the cluster; HTTP requests keep the 120s default.
limit_time_real_cron = 1200
