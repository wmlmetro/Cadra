[options]
admin_passwd = admin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo

http_port = 8069
; Odoo 16+ replaced longpolling_port with gevent_port; websocket traffic
; (/websocket/) is served on this port in a multi-worker setup.
gevent_port = 8072
http_interface = 0.0.0.0
proxy_mode = True
without_demo = True
log_level = info

; Default Odoo 19 addons + this repo (root) + the CRND 19 foundation (crnd-19)
; + the legacy 15.0 vendor tree (dist) is intentionally NOT on the path here —
; the rebuild installs a trimmed, ported module set, not the old dist/ bundle.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/crnd-19,/mnt/extra-addons/oca-19

; Dev convenience
list_db = True

workers = 2
max_cron_threads = 1
