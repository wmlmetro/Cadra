upstream odoo_http {
  server odoo:8069;
}

upstream odoo_longpolling {
  server odoo:8072;
}

server {
  listen 8069;

  client_max_body_size 50m;

  location /longpolling {
    proxy_pass http://odoo_longpolling;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # ─── Modern React SPA (served locally like the staging `frontend` pod) ──
  # The bundle is built with BASE_PATH=/app/ and mounted at /usr/share/nginx/html
  # from Frontend/artifacts/nrs-asset-register/dist/public (see docker-compose.19.yml).
  # Everything else — /web, /api (incl. /api/v1/brand for per-tenant branding),
  # /longpolling — still falls through to Odoo below. Mirrors the app's own
  # nginx.conf location rules.
  location = /app { return 301 /app/; }

  # Hashed JS/CSS bundles. `^~` beats the SPA block. Real bundle files resolve
  # to themselves; client routes like /app/assets/<id> fall back to the shell.
  location ^~ /app/assets/ {
    alias /usr/share/nginx/html/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri /app/index.html;
  }

  location /app/ {
    alias /usr/share/nginx/html/;
    add_header Cache-Control "no-cache" always;
    try_files $uri /app/index.html;
  }

  location / {
    proxy_pass http://odoo_http;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}

