[options]
admin_passwd = admin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo

http_port = 8069
longpolling_port = 8072
http_interface = 0.0.0.0
proxy_mode = True
without_demo = True
log_level = info

; Default Odoo addons + this repo (root + dist)
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/dist

; Dev convenience
list_db = True

; Dev mode: enable longpolling on separate port (nginx proxies /longpolling)
workers = 2
max_cron_threads = 1
