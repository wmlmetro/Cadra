[options]
admin_passwd = admin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; db_name is deliberately NOT set — same reasoning as config/odoo.19.conf.
; `cron_database_list()` is `config['db_name'] or list_dbs(True)`, so setting
; it here pins the scheduler to one database and every other tenant's ir.cron
; never runs. Which databases HTTP exposes is the dbfilter's job
; (`--db-filter`, passed by docker-compose.dev.yml from ODOO_DBFILTER):
; `^odoo$` for the single-database default, `^%d$` to route by host label.
; dbfilter does not narrow `list_dbs`, so cron still sees every database.

http_port = 8069
longpolling_port = 8072
http_interface = 0.0.0.0
proxy_mode = True
without_demo = True
log_level = info

; Default Odoo addons + this repo (root + dist)
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/dist

; Dev convenience
list_db = True

; Odoo's weekly phone-home, pointed at a closed port — same reasoning as
; config/odoo.19.conf. It POSTs the database name and uuid, the installed app
; list and the company's name, email and phone to services.odoo.com; on this
; stack those companies are named client organisations. It had never fired
; because the scheduler was pinned to one database, which was an accident
; rather than a decision.
publisher_warranty_url = http://localhost:1/publisher-warranty/

; Dev mode: enable longpolling on separate port (nginx proxies /longpolling)
workers = 2
max_cron_threads = 1
