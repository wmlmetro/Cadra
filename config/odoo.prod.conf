[options]
; ─── Production Odoo configuration ─────────────────────────────────────
; Secrets and host-specific values come from env vars at container start
; (see docker-compose.prod.yml `command:`) — this file holds structural
; defaults only.

; DB connection — overridden by HOST/USER/PASSWORD env vars in the Odoo
; image entrypoint. Don't set db_password here.
db_host = db
db_port = 5432

; HTTP
http_port = 8069
longpolling_port = 8072
http_interface = 0.0.0.0
proxy_mode = True

; Hide demo data and the DB manager UI in prod
without_demo = True
list_db = False

; Logging — Caddy captures stdout
log_level = info

; Addons
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/dist

; Resource limits — tuned via env in compose `command:`, defaults are
; intentionally conservative.
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

; admin_passwd is supplied via CLI (--admin-passwd=$ODOO_MASTER_PASSWORD)
; so it doesn't have to live in a file. Leaving it unset here is correct.
