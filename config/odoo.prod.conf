[options]
; ─── Production Odoo configuration — ODOO 19 ───────────────────────────
; Secrets and host-specific values come from env vars at container start
; (see docker-compose.prod.yml `command:`) — this file holds structural
; defaults only.
;
; This file was written for Odoo 15. Nothing in it made a 19 server REFUSE
; to start — which is the problem with all three of the corrections below.
; Each was a silent no-op or a silent wrong answer, and a prod profile that
; boots and then serves the wrong thing is harder to notice than one that
; fails. Each correction below says what it was and how it was measured.

; DB connection — overridden by HOST/USER/PASSWORD env vars in the Odoo
; image entrypoint. Don't set db_password here.
db_host = db
db_port = 5432

; db_name is deliberately NOT set — same reasoning as config/odoo.19.conf and
; k8s/dev/10-configmap-odoo-19.yaml. It restricts which databases HTTP
; exposes AND pins the cron worker to that same list
; (`cron_database_list()` is `config['db_name'] or list_dbs(True)`), so
; setting it here would mean no ir.cron ran on anything else — the defect
; handoff 08 found on the dev stack, which had been dormant for months.
; A client server has exactly one database, so the two jobs look identical
; there; they are not, and the day somebody restores a second database
; beside it the scheduler must not go quiet.

; HTTP
http_port = 8069
; Odoo 16+ replaced `longpolling_port` with `gevent_port`, and this file said
; `longpolling_port = 8072`.
;
; MEASURED on odoo:19.0 rather than assumed: `config._parse_config` does not
; reject the old spelling. It keeps it as an unrecognised string and leaves
; `gevent_port` at its DEFAULT — feed it `longpolling_port = 9999` and
; `config['gevent_port']` still reads 8072. So the setting was not an error,
; it was ignored, and it happened to name the port the default already used.
; An operator who moved the websocket port for any reason would have had
; Caddy's `/websocket` upstream pointing at a closed port, with nothing
; anywhere saying why.
gevent_port = 8072
http_interface = 0.0.0.0
proxy_mode = True

; Hide demo data and the DB manager UI in prod
without_demo = True
list_db = False

; Logging — Caddy captures stdout
log_level = info

; Addons. This line used to read `...,/mnt/extra-addons,/mnt/extra-addons/dist`
; — the Odoo 15 vendor tree, and NOT crnd-19 or oca-19, which is where the
; ported 19 foundation actually lives.
;
; That is not a cosmetic difference. ELEVEN module names exist in BOTH trees:
; base_field_m2m_view, generic_condition, generic_location, generic_m2o,
; generic_mixin, generic_resource, generic_rule, generic_service, generic_tag,
; generic_team and web_responsive. Odoo resolves a module to the FIRST
; addons_path entry that holds it, so the old line pointed a 19 server at the
; Odoo 15 copy of every one of them and at no copy of the ported ones. The
; server starts; the registry it builds is the wrong one.
;
; The 19 foundation is crnd-19 and oca-19, exactly as config/odoo.19.conf and
; k8s/dev/10-configmap-odoo-19.yaml have it, and dist/ is on no 19 path
; anywhere in this repo.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/crnd-19,/mnt/extra-addons/oca-19

; Odoo's weekly phone-home, pointed at a closed port — the same decision
; handoff 09 took for config/odoo.19.conf and the cluster, and it matters
; MORE here, not less. `mail.ir_cron_module_update_notification` POSTs the
; database name and uuid, web.base.url, the installed app list, user counts
; and the company's name, email and phone to services.odoo.com once a week.
; On a client server that company is the client. Disclosing a customer's
; identity to a third party as a side effect of an upstream default is not
; something a deployment gets to do quietly.
publisher_warranty_url = http://localhost:1/publisher-warranty/

; Resource limits — tuned via env in compose `command:`, defaults are
; intentionally conservative.
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

; The cron watchdog, separated from the HTTP one. `limit_time_real_cron`
; defaults to -1, meaning "use limit_time_real" — which is fine here only
; because limit_time_real is already 1200. Stating it means a later tightening
; of the HTTP timeout, which is the ordinary thing to want, cannot silently
; start SIGKILLing depreciation and PM runs mid-transaction.
limit_time_real_cron = 1200

; admin_passwd is NOT set here, and the comment that used to sit in its place
; said it was "supplied via CLI (--admin-passwd=$ODOO_MASTER_PASSWORD)". No
; Odoo major has such a flag — `odoo server --help` on 19.0 has no
; `--admin-passwd`, and 15 had none either — so that sentence described a
; mechanism that has never existed. What actually supplies it is
; docker-compose.prod.yml's `command:`, which copies this file to a writable
; path and appends `admin_passwd` from ODOO_MASTER_PASSWORD. Leaving it unset
; here is still correct; the reason it gave was not.
